name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q
      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/lumdit-windows.spec
      - name: Smoke test frozen exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LumDIT\LumDIT.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "LumDIT.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} packaging\lumdit.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\LumDIT\* -DestinationPath dist\LumDIT-${{ needs.version.outputs.version }}-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/LumDIT-*-Setup.exe
            dist/LumDIT-*-Windows-portable.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q
      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/lumdit-macos.spec
      - name: Ad-hoc sign
        # Unsigned arm64 binaries are refused by macOS; an ad-hoc signature lets users
        # open the app via right-click > Open. Replace with a Developer ID for notarised builds.
        run: codesign --force --deep --sign - dist/LumDIT.app
      - name: Smoke test frozen app
        run: |
          dist/LumDIT.app/Contents/MacOS/LumDIT &
          PID=$!
          sleep 8
          if ! kill -0 $PID 2>/dev/null; then echo "LumDIT exited early"; exit 1; fi
          kill $PID
      - name: Build DMG
        run: |
          VER=${{ needs.version.outputs.version }}
          ARCH=$(uname -m)
          STAGE=$(mktemp -d)
          cp -R dist/LumDIT.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "LumDIT $VER" -srcfolder "$STAGE" -ov -format UDZO "dist/LumDIT-$VER-macOS-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/LumDIT-*.dmg
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ needs.version.outputs.version }}
          cat > notes.md <<EOF
          ## LumDIT $VER

          **Windows:** run \`LumDIT-$VER-Setup.exe\` (or unzip the portable build). SmartScreen may warn because the installer is not code-signed: choose *More info > Run anyway*.

          **macOS (Apple Silicon):** open the \`.dmg\` and drag LumDIT to Applications. The app is ad-hoc signed, not notarised, so on first launch right-click the app and choose *Open*, or run \`xattr -dr com.apple.quarantine /Applications/LumDIT.app\`.

          **Card log:** add \`MONGO_URI\` under Settings > Card Log, or place a \`.env\` next to the executable.

          SHA-256 checksums are in \`SHA256SUMS.txt\`.
          EOF
          gh release create "v$VER" artifacts/* --title "LumDIT $VER" --notes-file notes.md --generate-notes
